name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  laravel-pest:
    name: Backend Tests & Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: invoiceflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl, zip, gd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy .env
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run Pint (Style Check)
        run: ./vendor/bin/pint --test

      - name: Run Migrations & Pest Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: invoiceflow_test
          DB_USERNAME: postgres
          DB_PASSWORD: password
          APP_ENV: testing
        run: ./vendor/bin/pest

  frontend-build:
    name: Frontend Types & Build Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npm run types

      - name: Run Vite Build
        run: npm run build

